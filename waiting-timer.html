<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Session Waiting Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7250e3 0%, #0093E9 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            transition: background 0.8s ease-in-out;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            z-index: -1;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: scale(0.95);
            animation: bounceIn 0.8s forwards;
            margin: auto; /* Centers the container vertically */
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        .input-form {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 1.1em;
            font-weight: 500;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="time"], textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            transition: background-color 0.3s ease;
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: #fff;
            color: #007bff;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        h1#training-title {
            font-size: 3.5em;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
        }
        
        #gemini-summary {
            font-size: 1.2em;
            max-width: 80%;
            margin: 20px auto;
            line-height: 1.6;
            font-weight: 300;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
            animation-delay: 0.5s;
        }
        
        #timer {
            font-size: 3em;
            font-weight: 700;
            margin-top: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: #fff;
            color: #333;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
        }

        #custom-alert button {
            margin-top: 10px;
        }
        
        .theme-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Time Controls */
        #time-controls {
            display: none; /* Hidden by default */
            margin-top: 20px;
            gap: 15px;
        }
        
        #time-controls button {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: none;
        }
        
        #time-controls button:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* --- THEMES --- */
        .aws-theme { background: linear-gradient(135deg, #FF9900 0%, #232F3E 100%); }
        .gcp-theme { background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); }
        .python-theme { background: linear-gradient(135deg, #4B8BBE 0%, #306998 100%); }
        .react-theme { background: linear-gradient(135deg, #61DAFB 0%, #20232A 100%); }
        .js-theme { background: linear-gradient(135deg, #F0DB4F 0%, #1a1a1a 100%); }
    </style>
</head>
<body>
    <div id="custom-alert">
        <p id="alert-message"></p>
        <button onclick="hideAlert()">OK</button>
    </div>

    <div class="container">
        <div id="input-section">
            <h2>Enter Training Details</h2>
            <div class="input-group">
                <label for="trainingName">Training Name:</label>
                <input type="text" id="trainingName" placeholder="e.g., AWS, React, Python">
            </div>
            
            <div class="input-group">
                <label for="aiRecapKeywords">Previous Session Keywords:</label>
                <textarea id="aiRecapKeywords" placeholder="AWS, S3, EC2, IAM, security"></textarea>
            </div>
            
            <div class="input-group" style="margin-top: 20px;">
                <label for="startTime">Session Start Time:</label>
                <input type="time" id="startTime">
            </div>

            <button id="geminiButton" onclick="generateAndDisplay()">Generate Summary</button>

        </div>

        <div id="display-section" style="display: none;" class="theme-container">
            <h1 id="training-title" class="fade-in"></h1>
            
            <p id="gemini-summary" class="fade-in"></p>
            
            <p id="message" class="fade-in">Training will start in...</p>
            <p id="timer" class="fade-in">--:--:--</p>

            <div id="time-controls" style="display: flex;">
                <button onclick="adjustTime(5)">+ 5 Min</button>
                <button onclick="adjustTime(-5)">- 5 Min</button>
            </div>
        </div>
    </div>

    <script>
        let countdownInterval;
        let factInterval;
        let sessionStartTime;

        const themes = {
            'aws': {
                gradient: 'linear-gradient(135deg, #FF9900 0%, #232F3E 100%)',
            },
            'gcp': {
                gradient: 'linear-gradient(135deg, #4285F4 0%, #34A853 100%)',
            },
            'python': {
                gradient: 'linear-gradient(135deg, #4B8BBE 0%, #306998 100%)',
            },
            'react': {
                gradient: 'linear-gradient(135deg, #61DAFB 0%, #20232A 100%)',
            },
            'js': {
                gradient: 'linear-gradient(135deg, #F0DB4F 0%, #1a1a1a 100%)',
            },
            'javascript': {
                gradient: 'linear-gradient(135deg, #F0DB4F 0%, #1a1a1a 100%)',
            }
        };

        function applyTheme(topic) {
            const lowercaseTopic = topic.toLowerCase();
            const theme = themes[lowercaseTopic] || null;
            const body = document.body;
            
            if (theme) {
                body.style.background = theme.gradient;
            } else {
                // Default theme if no match is found
                body.style.background = 'linear-gradient(135deg, #7250e3 0%, #0093E9 100%)';
            }
        }

        function showAlert(message) {
            document.getElementById('alert-message').textContent = message;
            document.getElementById('custom-alert').style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('custom-alert').style.display = 'none';
        }

        function displayWaitingScreen(trainingName, facts) {
            const startTimeValue = document.getElementById('startTime').value;
            if (!startTimeValue) {
                showAlert('Please enter a Session Start Time.');
                return;
            }

            document.getElementById('training-title').textContent = trainingName;
            
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('display-section').style.display = 'flex';
            document.getElementById('time-controls').style.display = 'flex';
            
            applyTheme(trainingName);
            sessionStartTime = new Date();
            const [startHours, startMinutes] = startTimeValue.split(':').map(Number);
            sessionStartTime.setHours(startHours, startMinutes, 0, 0);

            // If start time is in the past, set it for the next day
            const now = new Date();
            if (sessionStartTime.getTime() < now.getTime()) {
                sessionStartTime.setDate(sessionStartTime.getDate() + 1);
            }

            startCountdown();
            displayFacts(facts);
        }

        async function generateAndDisplay() {
            const trainingName = document.getElementById('trainingName').value;
            const aiKeywords = document.getElementById('aiRecapKeywords').value;
            const startTime = document.getElementById('startTime').value;
            const geminiButton = document.getElementById('geminiButton');

            if (trainingName.trim() === '' || aiKeywords.trim() === '' || startTime.trim() === '') {
                showAlert("Please enter a Training Name, Keywords, and a Start Time to generate facts.");
                return;
            }

            geminiButton.disabled = true;
            geminiButton.innerHTML = '<div class="loader"></div> Generating...';
            
            // =========================================================================
            //  ACTION REQUIRED: Replace the empty string below with your own API key.
            //  You can get one from Google AI Studio.
            // =========================================================================
            const apiKey = "AIzaSyBCfyPO5bx7rWtT7tThQUNkIqNFAyRUgOw"; 

            const userPrompt = `Generate a JSON array of 4-5 concise, single-sentence facts about the topic and keywords provided. The facts should include:
1. A real-world case study or company using the technology.
2. A technical limit, feature, or pricing detail.
3. A comparison to a similar service from a competing provider.
4. Other interesting, real-world usage facts.

Respond only with the JSON object.
Topic: ${trainingName}
Keywords: ${aiKeywords}`;

            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            facts: {
                                type: "ARRAY",
                                items: {
                                    type: "STRING"
                                }
                            }
                        }
                    }
                }
            };
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }

                const result = await response.json();
                const factData = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                let facts = [];

                if (factData) {
                    const parsedJson = JSON.parse(factData);
                    facts = parsedJson.facts || [];
                }

                if (facts.length === 0) {
                    facts = ["Failed to generate facts.", "Please check the keywords and try again."];
                }

                displayWaitingScreen(trainingName, facts);

            } catch (error) {
                console.error("Gemini API Error:", error);
                showAlert("An error occurred while generating the facts. Please try again.");
            } finally {
                geminiButton.disabled = false;
                geminiButton.innerHTML = 'Generate Summary';
            }
        }

        function displayFacts(facts) {
            clearInterval(factInterval);
            let factIndex = 0;
            const summaryElement = document.getElementById('gemini-summary');
            
            function showNextFact() {
                if (facts.length > 0) {
                    summaryElement.textContent = "Do you know " + facts[factIndex];
                    factIndex = (factIndex + 1) % facts.length;
                }
            }

            showNextFact(); // Show the first fact immediately
            factInterval = setInterval(showNextFact, 10000); // Change fact every 10 seconds
        }

        function startCountdown() {
            clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                const now = new Date();
                const timeRemaining = sessionStartTime.getTime() - now.getTime();
                
                if (timeRemaining <= 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('timer').textContent = "Session has started!";
                    document.getElementById('message').style.display = 'none';
                    return;
                }

                const hours = Math.floor(timeRemaining / (1000 * 60 * 60));
                const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

                const formatTime = (time) => String(time).padStart(2, '0');
                
                document.getElementById('timer').textContent = `${formatTime(hours)}:${formatTime(minutes)}:${formatTime(seconds)}`;
                document.getElementById('message').textContent = `Training will start in...`;

            }, 1000);
        }

        function adjustTime(minutes) {
            if (sessionStartTime) {
                const newTime = new Date(sessionStartTime.getTime() + minutes * 60000);
                sessionStartTime = newTime;
                startCountdown(); // Restart the countdown with the new time
            }
        }
    </script>

</body>
</html>
