<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            animation: bgGradient 10s infinite alternate;
            overflow: hidden;
        }
        
        @keyframes bgGradient {
            0% { background: linear-gradient(135deg, #ff00ff, #00ffff); }
            25% { background: linear-gradient(135deg, #ffff00, #00ff00); }
            50% { background: linear-gradient(135deg, #00ff00, #0000ff); }
            75% { background: linear-gradient(135deg, #ff0000, #ffff00); }
            100% { background: linear-gradient(135deg, #ff00ff, #00ffff); }
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 2rem;
            border: 5px ridge #ff00ff;
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            position: relative;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        h1 {
            color: #ff00ff;
            text-shadow: 3px 3px 0 #00ffff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .stats {
            background-color: #e0e0ff;
            border: 3px ridge #0000ff;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
        }
        
        .stat-item {
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        
        .stat-value {
            font-weight: bold;
            color: #ff0000;
            text-shadow: 1px 1px 0 #ffffff;
        }
        
        .task-form {
            display: flex;
            margin: 1.5rem 0;
            gap: 10px;
        }
        
        #taskInput {
            flex: 1;
            padding: 10px;
            font-family: 'Comic Sans MS', 'Courier New', monospace;
            font-size: 1rem;
            border: 3px ridge #00ff00;
            border-radius: 5px;
        }
        
        #addTaskBtn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Comic Sans MS', 'Courier New', monospace;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }
        
        #addTaskBtn:hover {
            background-color: #45a049;
        }
        
        #taskList {
            list-style-type: none;
            padding: 0;
            margin: 1.5rem 0;
        }
        
        .task-item {
            background-color: #f0f0ff;
            border: 3px ridge #0000ff;
            margin: 0.8rem 0;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .task-text {
            flex: 1;
            text-align: left;
            font-size: 1.1rem;
            margin-right: 1rem;
        }
        
        .completed .task-text {
            text-decoration: line-through;
            color: #888;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .complete-btn, .delete-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Comic Sans MS', 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .complete-btn {
            background-color: #00ff00;
            color: #000;
        }
        
        .delete-btn {
            background-color: #ff0000;
            color: white;
        }
        
        .empty-state {
            font-style: italic;
            color: #666;
            font-size: 1.1rem;
            margin: 1rem 0;
        }
        
        .signature {
            margin-top: 2rem;
            font-style: italic;
            color: #0000ff;
            font-weight: bold;
            text-shadow: 1px 1px 0 #ffffff;
            animation: slideIn 1s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 1990s style blinking text */
        .blinking {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        /* Floating elements */
        .floating {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            z-index: -1;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        .float1 { top: 10%; left: 10%; animation-delay: 0s; }
        .float2 { top: 20%; right: 15%; animation-delay: 1s; }
        .float3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .float4 { bottom: 25%; right: 10%; animation-delay: 0.5s; }
        
        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
                width: 95%;
            }
            
            .task-form {
                flex-direction: column;
            }
            
            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .task-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>
        
        <div class="stats">
            <div class="stat-item">Total Tasks: <span id="totalTasks" class="stat-value">0</span></div>
            <div class="stat-item">Completed: <span id="completedTasks" class="stat-value">0</span></div>
        </div>
        
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            <button id="addTaskBtn">Add Task</button>
        </div>
        
        <ul id="taskList">
            <li class="empty-state">No tasks yet. Add your first task!</li>
        </ul>
        
        <div class="signature">Designed by Shubham Dalvi</div>
    </div>
    
    <!-- Floating 1990s elements -->
    <div class="floating float1">★</div>
    <div class="floating float2">☀</div>
    <div class="floating float3">☂</div>
    <div class="floating float4">✦</div>
    
    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');
        const totalTasksSpan = document.getElementById('totalTasks');
        const completedTasksSpan = document.getElementById('completedTasks');
        
        // Load tasks from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        
        // Initialize the app
        function init() {
            renderTasks();
            updateStats();
            
            // Event listeners
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        }
        
        // Add a new task
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText === '') return;
            
            const newTask = {
                id: Date.now(),
                text: taskText,
                completed: false
            };
            
            tasks.push(newTask);
            saveTasks();
            renderTasks();
            updateStats();
            
            // Clear input
            taskInput.value = '';
            taskInput.focus();
        }
        
        // Toggle task completion
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return {...task, completed: !task.completed};
                }
                return task;
            });
            
            saveTasks();
            renderTasks();
            updateStats();
        }
        
        // Delete a task
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
            updateStats();
        }
        
        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }
        
        // Render tasks to the DOM
        function renderTasks() {
            if (tasks.length === 0) {
                taskList.innerHTML = '<li class="empty-state">No tasks yet. Add your first task!</li>';
                return;
            }
            
            taskList.innerHTML = '';
            
            tasks.forEach(task => {
                const taskItem = document.createElement('li');
                taskItem.className = `task-item ${task.completed ? 'completed' : ''}`;
                taskItem.innerHTML = `
                    <span class="task-text">${task.text}</span>
                    <div class="task-actions">
                        <button class="complete-btn" onclick="toggleTask(${task.id})">
                            ${task.completed ? 'Undo' : 'Complete'}
                        </button>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;
                taskList.appendChild(taskItem);
            });
        }
        
        // Update statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(task => task.completed).length;
            
            totalTasksSpan.textContent = total;
            completedTasksSpan.textContent = completed;
        }
        
        // Initialize the application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
