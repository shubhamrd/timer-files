<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Timer - Gemini Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- SETUP VIEW -->
    <div id="setup-view" class="w-full max-w-lg p-6 glass-panel rounded-2xl fade-in relative z-10 m-4 overflow-y-auto max-h-screen">
        <h1 class="text-xl font-bold text-white mb-4 text-center tracking-tight">Training Setup</h1>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Training Topic</label>
                <input type="text" id="input-title" placeholder="e.g., Advanced Kubernetes"
                    class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 placeholder-gray-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-300 mb-1">Training Start Time</label>
                <input type="time" id="input-start-time"
                    class="w-full bg-gray-800 border border-gray-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 text-center font-mono">
            </div>

            <div class="pt-4 border-t border-gray-700">
                <button onclick="startSession()"
                    class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-all transform hover:scale-[1.02] shadow-lg">
                    Start Waiting Screen
                </button>
            </div>
        </div>
    </div>

    <!-- PRESENTATION VIEW -->
    <div id="presentation-view" class="hidden flex-col items-center justify-center w-full h-full max-w-7xl px-4 relative z-10 py-4">

        <!-- Header Info -->
        <div class="mb-4 fade-in w-full max-w-4xl text-center">
            <span class="inline-block py-0.5 px-2 rounded-full bg-blue-500/20 text-blue-300 text-[10px] font-bold tracking-wider uppercase mb-2 border border-blue-500/30">
                Live Training Session
            </span>
            <h1 id="display-title" class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 mb-2 tracking-tight leading-tight">
                Training Title Here
            </h1>
            <p class="text-base text-gray-400 font-light mb-4">
                Presenter: <span class="text-white font-medium">Shubham Dalvi</span>
            </p>

            <!-- Dynamic Facts Display -->
            <div id="display-facts-container" class="hidden relative overflow-hidden bg-white/5 border border-white/10 rounded-xl p-4 backdrop-blur-sm mx-auto max-w-2xl min-h-[100px] flex flex-col justify-center items-center transform transition-all hover:bg-white/10">
                <h3 class="text-blue-300 text-[10px] font-bold uppercase tracking-widest mb-2 border-b border-blue-500/20 pb-1">
                    Industry Insight
                </h3>
                <div id="display-fact-text" class="text-gray-200 text-base md:text-lg font-medium leading-snug italic text-center">
                    <!-- Fact will be injected here -->
                </div>
                <!-- Progress bar for the fact timer (30 seconds) -->
                <div class="absolute bottom-0 left-0 h-0.5 bg-blue-500/30 w-full">
                    <div id="fact-progress" class="h-full bg-blue-400 transition-all duration-[30000ms] ease-linear w-0"></div>
                </div>
            </div>
        </div>

        <!-- Timer Card -->
        <div class="glass-panel p-6 md:p-10 rounded-3xl mb-6 fade-in w-full max-w-xl mx-auto transform transition-all hover:border-blue-500/30 flex flex-col items-center justify-center">
            <p class="text-gray-400 uppercase tracking-widest text-xs font-semibold mb-2">We will start in</p>
            <div id="timer-display" class="text-6xl md:text-8xl font-mono font-bold text-white tabular-nums tracking-tighter mb-2 leading-none">
                00:00
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-gray-700 h-1.5 rounded-full mt-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-1000 ease-linear" style="width: 100%"></div>
            </div>
        </div>

        <!-- Status Message -->
        <div class="fade-in mb-8">
            <div class="flex items-center justify-center space-x-2 text-gray-300 bg-black/20 inline-flex px-4 py-2 rounded-full backdrop-blur-sm border border-white/5">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                </span>
                <span class="font-medium text-sm tracking-wide" id="status-message">Generating insights...</span>
            </div>
        </div>

        <!-- Hidden Controls (Hover to show at bottom) -->
        <div class="fixed bottom-4 left-0 right-0 flex justify-center opacity-0 hover:opacity-100 transition-opacity duration-300 pointer-events-auto">
            <div class="bg-gray-900/80 backdrop-blur rounded-lg p-1.5 flex space-x-1 border border-gray-700 shadow-2xl">
                <button onclick="adjustTime(1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-[10px] text-white">+1m</button>
                <button onclick="adjustTime(5)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-[10px] text-white">+5m</button>
                <button onclick="adjustTime(-1)" class="px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-[10px] text-white">-1m</button>
            </div>
        </div>

    </div>

    <!-- Background decorative elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px]"></div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyDXkz8qb5VtyNzcStBkCtq6wwx4OSPaWXQ";

        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerInterval;

        // Facts Logic Variables
        let factsArray = [];
        let currentFactIndex = 0;
        let factInterval;
        const FACT_INTERVAL_MS = 30000; // 30 seconds

        // Set default time to 5 minutes from now
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const future = new Date(now.getTime() + 5 * 60000);
            const hours = future.getHours().toString().padStart(2, '0');
            const minutes = future.getMinutes().toString().padStart(2, '0');
            document.getElementById('input-start-time').value = `${hours}:${minutes}`;
        });

        function calculateRemainingTime(startTimeValue) {
            const now = new Date();
            const [startHours, startMinutes] = startTimeValue.split(':').map(Number);

            const startDate = new Date();
            startDate.setHours(startHours, startMinutes, 0, 0);

            if (startDate.getTime() < now.getTime() && (now.getHours() > startHours || (now.getHours() === startHours && now.getMinutes() >= startMinutes))) {
                startDate.setDate(startDate.getDate() + 1);
            }

            return Math.max(0, Math.floor((startDate.getTime() - now.getTime()) / 1000));
        }

        async function generateFactsWithGemini(title, factCount) {
            const prompt = `You are an expert technical trainer. For the training topic '${title}', generate a JSON array of ${factCount} distinct, engaging, single-sentence insights. 
            The insights must cover real-world case studies, key statistics or facts, and primary use cases or benefits. 
            Respond ONLY with the valid JSON array of strings. Do not use markdown formatting.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                const result = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (result) {
                    try {
                        const parsedFacts = JSON.parse(result);
                        return Array.isArray(parsedFacts) ? parsedFacts : [result];
                    } catch (e) {
                        return result.replace(/[\[\]"]/g, '').split('\n').filter(l => l.trim() !== '');
                    }
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
            }

            // Fallback facts
            return ["Get ready for an exciting session!", "The training will begin shortly."];
        }

        async function startSession() {
            const titleInput = document.getElementById('input-title').value;
            const startTimeValue = document.getElementById('input-start-time').value;

            if (!startTimeValue || startTimeValue.trim() === '') {
                alert("Please specify the Training Start Time.");
                return;
            }

            const remainingTime = calculateRemainingTime(startTimeValue);

            if (remainingTime <= 0) {
                alert("The specified start time is in the past. Please select a time in the future.");
                return;
            }

            // Set title
            document.getElementById('display-title').textContent = titleInput.trim() || "Untitled Session";

            // Calculate fact count: 1 fact per minute remaining, minimum 5
            const factCount = Math.max(5, Math.ceil(remainingTime / 60));

            // Generate facts from Gemini
            document.getElementById('status-message').textContent = "Generating insights...";
            factsArray = await generateFactsWithGemini(titleInput, factCount);

            // Show facts container
            if (factsArray.length > 0) {
                document.getElementById('display-facts-container').classList.remove('hidden');
                document.getElementById('display-facts-container').classList.add('flex');
                startFactRotation();
            }

            // Initial Time Setup
            totalSeconds = remainingTime;
            remainingSeconds = remainingTime;

            // Toggle Views
            document.getElementById('setup-view').classList.add('hidden');
            const presentationView = document.getElementById('presentation-view');
            presentationView.classList.remove('hidden');
            presentationView.classList.add('flex');

            // Update status
            document.getElementById('status-message').textContent = "Waiting for training to start...";

            // Start Timer
            updateTimerUI();
            timerInterval = setInterval(tick, 1000);
        }

        function startFactRotation() {
            if (factInterval) clearInterval(factInterval);
            showNextFact();
            factInterval = setInterval(showNextFact, FACT_INTERVAL_MS);
        }

        function showNextFact() {
            if (factsArray.length === 0) return;

            const factElement = document.getElementById('display-fact-text');
            const progressBar = document.getElementById('fact-progress');

            // Reset animation
            factElement.classList.remove('slide-up');
            void factElement.offsetWidth;

            // Update text
            factElement.textContent = factsArray[currentFactIndex];
            factElement.classList.add('slide-up');

            // Reset and start progress bar
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            void progressBar.offsetWidth;
            progressBar.style.transition = `width ${FACT_INTERVAL_MS}ms linear`;
            progressBar.style.width = '100%';

            currentFactIndex = (currentFactIndex + 1) % factsArray.length;
        }

        function tick() {
            if (remainingSeconds > 0) {
                remainingSeconds--;
                updateTimerUI();
            } else {
                clearInterval(timerInterval);
                timerFinished();
            }
        }

        function updateTimerUI() {
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            const formattedTime = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            document.getElementById('timer-display').textContent = formattedTime;

            // Update Progress Bar
            const percentage = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            // Color Logic (Turn red if under 1 minute)
            const progressBar = document.getElementById('progress-bar');
            if (remainingSeconds <= 60) {
                progressBar.classList.remove('bg-blue-500');
                progressBar.classList.add('bg-red-500');
            } else {
                progressBar.classList.add('bg-blue-500');
                progressBar.classList.remove('bg-red-500');
            }
        }

        function timerFinished() {
            document.getElementById('timer-display').textContent = "00:00";
            document.getElementById('timer-display').classList.add('text-green-400');
            document.querySelector('.animate-ping').classList.remove('bg-green-400');
            document.querySelector('.animate-ping').classList.add('bg-blue-400');
            document.getElementById('status-message').textContent = "Training will start soon.";

            if (factInterval) clearInterval(factInterval);
        }

        function adjustTime(minutes) {
            remainingSeconds += (minutes * 60);
            if (remainingSeconds < 0) remainingSeconds = 0;

            if (remainingSeconds > totalSeconds) {
                totalSeconds = remainingSeconds;
            }

            updateTimerUI();

            if (remainingSeconds > 0 && !timerInterval) {
                timerInterval = setInterval(tick, 1000);
            }
        }
    </script>
</body>
</html>
